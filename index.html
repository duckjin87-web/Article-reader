<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>기사 읽어주기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="기사읽기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b1e; --card:rgba(255,255,255,.07);
  --brd:rgba(167,139,250,.22); --brd2:rgba(167,139,250,.55);
  --ac:#7c3aed; --ac2:#4f46e5; --hi:#c4b5fd; --hi2:#818cf8; --sky:#38bdf8;
  --tx:#f0eefc; --mu:#94a3b8; --mu2:#64748b;
  --red:rgba(239,68,68,.13); --rbrd:rgba(239,68,68,.38); --rtx:#fca5a5;
  --grn:rgba(34,197,94,.12); --gbrd:rgba(34,197,94,.32); --gtx:#86efac;
  --ylw:rgba(251,191,36,.10); --ybrd:rgba(251,191,36,.32); --ytx:#fde68a;
  --gold:#fbbf24;
  --player-h:300px;
}
html,body{
  height:100%;
  background:linear-gradient(160deg,#0d0b1e 0%,#12103a 100%);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--tx); overflow-x:hidden;
}
body{
  display:flex; flex-direction:column;
  padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
/* HEADER */
.hd{text-align:center;padding:22px 20px 8px;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.3) 0%,transparent 60%);flex-shrink:0}
.hd-ti{font-size:22px;font-weight:900;background:linear-gradient(110deg,#c4b5fd 0%,#818cf8 45%,#38bdf8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px}
.hd-su{color:var(--mu);font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px}
.tts-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.tts-badge.hi{background:rgba(34,197,94,.15);color:var(--gtx)}
.tts-badge.lo{background:rgba(167,139,250,.15);color:var(--hi)}
/* TABS */
.tabs{display:flex;flex-shrink:0;margin:10px 20px 0;background:var(--card);border:1px solid var(--brd);border-radius:13px;overflow:hidden;max-width:560px;align-self:center;width:calc(100% - 40px)}
.tab{flex:1;padding:11px 0;background:transparent;border:none;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.tab.on{background:rgba(124,58,237,.25);color:var(--hi)}
/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px 8px;display:flex;flex-direction:column;align-items:center;width:100%;box-sizing:border-box}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:3px}
/* URL INPUT 영역 (스크롤 밖 고정) */
.url-area{flex-shrink:0;padding:10px 20px 4px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.url-row{width:100%;max-width:560px;display:flex;gap:8px;align-items:stretch;background:rgba(255,255,255,.09);border:1px solid var(--brd);border-radius:14px;padding:8px 8px 8px 14px;transition:border-color .2s,box-shadow .2s;box-sizing:border-box;min-width:0}
.url-row:focus-within{border-color:var(--brd2);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
#urlInput{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit;padding:8px 0}
#urlInput::placeholder{color:var(--mu2);font-size:12px}
.add-btn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;border-radius:10px;min-width:50px;height:50px;flex-shrink:0;color:#fff;font-size:26px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.add-btn:active{transform:scale(.9)}
/* BUTTONS */
.btn{border:none;border-radius:14px;padding:15px;width:100%;max-width:560px;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;transition:all .2s;display:block;margin-bottom:8px}
.btn-pri{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 18px rgba(124,58,237,.38)}
.btn-sec{background:var(--card);border:1px solid var(--brd);color:var(--mu)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.98)}
/* QUEUE */
.q-empty{width:100%;max-width:560px;border:1px dashed rgba(167,139,250,.2);border-radius:16px;padding:36px;text-align:center;color:var(--mu2);font-size:13px;margin-bottom:12px}
.q-list{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.q-item{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:14px 14px 12px;transition:all .3s;animation:fadeUp .22s ease-out;overflow:hidden;min-width:0;box-sizing:border-box}
.q-item.active{background:rgba(124,58,237,.18);border-color:rgba(124,58,237,.5);box-shadow:0 0 16px rgba(124,58,237,.22)}
.q-item.done{opacity:.45}
.q-item.err{background:var(--red);border-color:var(--rbrd)}
.q-main{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.q-main:active .q-info{opacity:.7}
.q-main:active .q-badge{transform:scale(.9)}
.q-badge{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:rgba(167,139,250,.15);color:var(--hi);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.q-item.active .q-badge{background:var(--ac);color:#fff;animation:pulse 1.5s infinite}
.q-info{flex:1;min-width:0}
.q-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.q-item.active .q-title{color:var(--hi)}
.q-item.done .q-title{color:var(--mu)}
.q-url{font-size:10px;color:var(--mu2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-sub{font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-sub.info{color:var(--hi)} .q-sub.err-t{color:var(--rtx)}
.q-st{font-size:14px;flex-shrink:0}
/* 인라인 버튼 행 */
.q-acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.qa{padding:7px 10px;border-radius:8px;border:none;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s;flex-shrink:0}
.qa:active{transform:scale(.92)}
.qa-site{background:rgba(56,189,248,.12);color:var(--sky)}
.qa-site.open{background:rgba(56,189,248,.25);color:#7dd3fc}
.qa-save{background:rgba(251,191,36,.1);color:var(--gold)}
.qa-save.saved{background:rgba(251,191,36,.2)}
.qa-share{background:rgba(124,58,237,.15);color:var(--hi)}
.qa-del{background:rgba(239,68,68,.1);color:var(--rtx);margin-left:auto}
/* 인라인 사이트 뷰 (아코디언) */
.q-site-wrap{
  overflow:hidden;
  max-height:0;
  transition:max-height .35s ease;
}
.q-site-wrap.open{max-height:480px}
.q-site-inner{padding-top:8px}
.q-site-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-site-note{font-size:11px;color:var(--mu2)}
.q-site-open-btn{
  font-size:11px;color:var(--sky);text-decoration:none;
  background:rgba(56,189,248,.1);padding:5px 12px;border-radius:8px;
  display:inline-block;
}
.q-site-iframe{width:100%;height:380px;border:none;border-radius:10px;background:#fff;display:block}
/* VOICE */
.voice-row{width:100%;max-width:560px;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--brd);border-radius:10px;padding:10px 14px;cursor:pointer;margin-bottom:8px;transition:border-color .2s}
.voice-row:hover{border-color:var(--brd2)}
.voice-row-lbl{flex:1;font-size:12px;color:var(--mu)}
.voice-sel{font-size:11px;color:var(--hi);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-panel{width:100%;max-width:560px;background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:12px;margin-bottom:10px;max-height:180px;overflow-y:auto;animation:fadeUp .2s}
.v-panel::-webkit-scrollbar{width:3px}
.v-panel::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:3px}
.vb{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;border:none;background:transparent;color:var(--mu);font-size:12px;font-family:inherit;cursor:pointer;width:100%;text-align:left;transition:all .2s;margin-bottom:3px}
.vb.on{background:rgba(124,58,237,.22);color:var(--hi)}
.vbadge{font-size:9px;padding:1px 6px;border-radius:8px;flex-shrink:0}
.vbadge.g{background:rgba(34,197,94,.15);color:#86efac}
.vbadge.f{background:rgba(236,72,153,.2);color:#f9a8d4}
.vbadge.k{background:rgba(59,130,246,.15);color:#93c5fd}
/* SAVED */
.sv-empty{width:100%;max-width:560px;border:1px dashed rgba(167,139,250,.2);border-radius:16px;padding:36px;text-align:center;color:var(--mu2);font-size:13px}
.sv-list{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.sv-item{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:13px;animation:fadeUp .22s ease-out}
.sv-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.sv-title{font-size:14px;font-weight:700;color:var(--tx);flex:1}
.sv-date{font-size:10px;color:var(--mu2);flex-shrink:0;padding-top:2px}
.sv-url{font-size:10px;color:var(--mu2);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-btns{display:flex;gap:6px}
.sv-btn{flex:1;padding:10px 0;border-radius:10px;border:none;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.sv-btn-add{background:rgba(124,58,237,.2);color:var(--hi)}
.sv-btn-share{background:rgba(56,189,248,.1);color:var(--sky)}
.sv-btn-del{background:rgba(239,68,68,.1);color:var(--rtx);flex:0 0 44px}
.sv-btn:active{transform:scale(.94)}
/* MESSAGES */
.msg{width:100%;max-width:560px;border-radius:12px;padding:11px 14px;font-size:12px;margin-bottom:10px;line-height:1.7;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.msg-e{background:var(--red);border:1px solid var(--rbrd);color:var(--rtx)}
.msg-w{background:var(--ylw);border:1px solid var(--ybrd);color:var(--ytx)}
.msg button{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0;padding:0}
/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(13,11,30,.95);border:1px solid var(--gbrd);border-radius:20px;padding:9px 20px;color:var(--gtx);font-size:13px;font-weight:700;z-index:500;white-space:nowrap;pointer-events:none;animation:fadeUp .25s ease-out}
/* SPINNER */
.spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(167,139,250,.2);border-top-color:var(--hi);animation:spin .8s linear infinite;vertical-align:middle}
/* PLAYER BAR */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,11,30,.97);border-top:1px solid var(--brd2);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:200}
.pl-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.pl-title{flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--hi)}
.pl-icon-btn{background:none;border:none;cursor:pointer;padding:0 2px;font-size:18px;line-height:1;transition:transform .15s;flex-shrink:0;color:var(--mu)}
.pl-icon-btn:active{transform:scale(.82)}
.prog-wrap{width:100%;height:5px;background:rgba(255,255,255,.1);border-radius:10px;margin-bottom:8px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ac),var(--sky));border-radius:10px;transition:width .3s}
/* 컨트롤 (2배 크기) */
.ctrls{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:8px}
.cb{border-radius:50%;border:1px solid var(--brd);background:var(--card);color:var(--hi2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.cb:active{transform:scale(.87)}
.cb.xs{width:52px;height:52px;font-size:20px}
.cb.skip{font-size:12px;font-weight:700;letter-spacing:-.3px;line-height:1.2;color:var(--hi)}
.cb.sm{width:62px;height:62px;font-size:24px}
.cb.lg{width:86px;height:86px;font-size:38px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;box-shadow:0 0 28px rgba(124,58,237,.6)}
/* 배속 슬라이더 */
.spd-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.spd-lbl{font-size:11px;color:var(--mu);flex-shrink:0;white-space:nowrap}
.spd-val{font-size:14px;font-weight:800;color:var(--hi);flex-shrink:0;min-width:42px;text-align:right}
.spd-sl{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:none;cursor:pointer;background:rgba(255,255,255,.15)}
.spd-sl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 0 12px rgba(124,58,237,.6)}
.spd-sl::-moz-range-thumb{width:28px;height:28px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
/* 읽는 부분 표시 — 3줄, 현재 문장 가운데 고정 */
.reading-strip{
  position:relative;
  font-size:13px;line-height:1.65;
  color:rgba(240,238,252,.65);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(167,139,250,.14);
  border-radius:10px;
  padding:8px 13px;
  margin-bottom:7px;
  box-sizing:border-box;
  height:calc(13px * 1.65 * 3 + 8px * 2);
  overflow-y:scroll;
  scrollbar-width:none;
  word-break:break-word;
  white-space:pre-wrap;
}
.reading-strip::-webkit-scrollbar{display:none}
.rdhlt{background:rgba(251,191,36,.38);color:var(--gold);border-radius:4px;padding:1px 3px;font-weight:700}
/* 예상 읽기 시간 */
.q-rt{font-size:10px;color:var(--mu2);flex-shrink:0;white-space:nowrap;padding:0 6px;line-height:1.4;text-align:right}
/* 직접입력 모달 */
.dinput-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s}
.dinput-inner{background:#1a1730;border:1px solid var(--brd);border-radius:20px;padding:20px;width:100%;max-width:520px;animation:fadeUp .2s}
.dinput-inner textarea{width:100%;height:210px;background:rgba(255,255,255,.07);border:1px solid var(--brd);border-radius:10px;color:var(--tx);font-family:inherit;font-size:13px;line-height:1.6;padding:12px;resize:none;margin:10px 0;outline:none}
.dinput-inner textarea:focus{border-color:var(--brd2)}
.dinput-btns{display:flex;gap:8px}
.dinput-cancel{flex:1;padding:12px;border-radius:10px;border:1px solid var(--brd);background:transparent;color:var(--mu);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.dinput-ok{flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
/* 공유 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s}
.sheet{background:#1a1730;border:1px solid var(--brd);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;animation:slideUp .25s ease-out}
.sheet-ttl{font-size:13px;font-weight:700;color:var(--hi);text-align:center;margin-bottom:14px}
.share-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sh-opt{padding:16px 0;border-radius:13px;border:none;background:var(--card);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:5px}
.sh-opt-ico{font-size:24px}
.sh-opt-lbl{font-size:11px;font-weight:600;color:var(--mu);font-family:inherit}
.sh-opt:active{transform:scale(.93);background:rgba(124,58,237,.2)}
.sheet-cancel{width:100%;padding:14px;border-radius:13px;border:none;background:rgba(255,255,255,.07);color:var(--mu);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.dn{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-ti">기사 읽어주기 🎙</div>
  <div class="hd-su">
    <span>운전 중 연속 청취</span>
    <span class="tts-badge lo" id="ttsBadge">⏳ 음성 확인 중</span>
  </div>
</div>

<div class="tabs">
  <button class="tab on" id="tabBtnQ" onclick="switchTab('queue')">📋 재생목록</button>
  <button class="tab" id="tabBtnS" onclick="switchTab('saved')">⭐ 저장됨</button>
</div>

<!-- URL 입력 영역: 스크롤 밖에 고정 -->
<div class="url-area" id="urlArea">
  <div class="url-row">
    <input id="urlInput" type="url" placeholder="기사 URL 붙여넣기 후 + 추가"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <button class="add-btn" onclick="addUrl()">＋</button>
  </div>
  <div class="msg msg-e dn" id="errMsg" style="width:100%;max-width:560px;margin-top:6px">
    <span id="errTxt"></span>
    <button onclick="hideErr()" style="color:var(--rtx)">✕</button>
  </div>
</div>

<div class="content">
  <div class="msg msg-w dn" id="ttsWarn" style="margin-top:4px">
    <span>⚠️ 음성 미지원. Android Chrome 또는 Safari를 이용해주세요.</span>
  </div>

  <!-- ═══ 재생목록 탭 ═══ -->
  <div id="tabQueue">
    <div class="q-empty" id="qEmpty">
      <div style="font-size:38px;margin-bottom:10px">📋</div>
      URL을 추가하면 여기에 목록이 표시됩니다<br>
      <span style="font-size:11px;opacity:.55;margin-top:6px;display:block">스티비 · 네이버 블로그 · YOZM · 뉴스 등</span>
    </div>
    <div class="q-list" id="qList"></div>
    <div id="qActions" class="dn" style="width:100%;max-width:560px">
      <button class="btn btn-pri" id="playAllBtn" onclick="loadAndPlay(0)">▶ &nbsp;전체 불러오기 &amp; 재생</button>
      <button class="btn btn-sec" onclick="clearAll()">🗑 &nbsp;전체 삭제</button>
    </div>
    <div class="voice-row dn" id="voiceRow" onclick="toggleVoice()">
      <span class="voice-row-lbl">🎙 목소리 선택 (한국어/영어)</span>
      <span class="voice-sel" id="curVoiceName"></span>
      <span id="voiceArrow" style="color:var(--mu);font-size:11px">▼</span>
    </div>
    <div class="v-panel dn" id="vPanel"><div id="vList"></div></div>
  </div>

  <!-- ═══ 저장됨 탭 ═══ -->
  <div id="tabSaved" class="dn" style="width:100%">
    <div class="sv-empty dn" id="svEmpty" style="margin-top:8px">
      <div style="font-size:38px;margin-bottom:10px">⭐</div>

<script>
/* ══════════════════════
   STATE
══════════════════════ */
let Q = [], SAVED = [];
let curIdx = -1, isOn = false, isPaused = false, wasInterrupted = false;
let spd = 1.0, selVoice = null, allVoices = [];
let wakeLock = null, uid = 0;
let activeTab = 'queue', voiceOpen = false;
let shareTarget = null;
let openSites = new Set(); // 펼쳐진 사이트 iframe ID 목록

const LS_Q = 'arq_v3', LS_SAVED = 'arq_saved_v1', LS_SPD = 'arq_spd';
const GOOGLE_KW = ['google 한국','google korean'];
const FEMALE_KW = ['yuna','유나','heami','혜미','sunhi','선희','sora','소라','female','여성','nari','나리'];
const SI = {pending:'⬜',loading:'',ready:'✅',done:'🔵',error:'❌'};

/* ══════════════════════
   TTS MANAGER
   (Google TTS via /api/tts → 자연스러운 한국어
    Fallback: Web Speech API)
══════════════════════ */
const TTS = {
  useAudio: null,  // null=미확인, true=Google, false=WebSpeech
  _chunks: [], _idx: 0, _offset: 0, _totalLen: 0,
  _playing: false, _paused: false, _audio: null,
  _onProgress: null, _onDone: null, _onChunkStart: null,
  _rate: 1.0, _lang: 'ko', _gen: 0,

  // /api/tts 가용 여부 확인
  async checkAvail(){
    if(this.useAudio !== null) return;
    try{
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 6000);
      const r = await fetch('/api/tts?text=%ED%85%8C%EC%8A%A4%ED%8A%B8&lang=ko', {signal:ctrl.signal});
      clearTimeout(tid);
      this.useAudio = r.ok && r.headers.get('content-type')?.includes('audio');
    }catch(_){ this.useAudio = false; }
    this._updateBadge();
  },

  _updateBadge(){
    const el = document.getElementById('ttsBadge');
    if(!el) return;
    if(this.useAudio){
      el.className='tts-badge hi'; el.textContent='🎵 Google TTS';
    } else {
      el.className='tts-badge lo'; el.textContent='🔊 기기 음성';
    }
  },

  // 텍스트를 ~180자 단위로 청크 분할 (문장 경계 우선)
  _split(text){
    const MAX = 180;
    const result = [];
    // 문장 단위로 먼저 분리
    const sentences = text.replace(/([.!?。\n])\s*/g,'$1\n').split('\n').filter(s=>s.trim());
    let cur = '';
    for(const s of sentences){
      const clean = s.trim();
      if(!clean) continue;
      if(cur.length + clean.length + 1 <= MAX){
        cur += (cur?' ':'' ) + clean;
      } else {
        if(cur) result.push(cur);
        if(clean.length <= MAX){ cur = clean; }
        else {
          // 강제 분할
          let rem = clean;
          while(rem.length > MAX){
            const cut = rem.lastIndexOf(' ', MAX);
            const pos = cut > 60 ? cut : MAX;
            result.push(rem.slice(0, pos).trim());
            rem = rem.slice(pos).trim();
          }
          cur = rem;
        }
      }
    }
    if(cur) result.push(cur);
    return result.filter(s=>s.length>0);
  },

  async start(text, lang){
    this._gen++;
    this.stop();
    await this.checkAvail();
    this._chunks = this._split(text);
    this._idx = 0; this._offset = 0;
    this._totalLen = text.length || 1;
    this._lang = lang || 'ko';
    this._playing = true; this._paused = false;
    this._next();
  },

  async _next(){
    if(!this._playing){ return; }
    const myGen = this._gen;
    if(this._idx >= this._chunks.length){
      this._playing = false;
      if(this._onDone) this._onDone();
      return;
    }
    const txt = this._chunks[this._idx];
    if(this._onChunkStart) this._onChunkStart(txt);

    if(this.useAudio){
      const blob = await this._fetchAudio(txt);
      if(this._gen !== myGen) return; // 스킵/정지로 무효화된 fetch
      if(blob){ this._playBlob(blob, txt); return; }
      this.useAudio = false; this._updateBadge();
    }
    if(this._gen !== myGen) return;
    this._playSpeech(txt);
  },

  async _fetchAudio(txt){
    try{
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 9000);
      const r = await fetch('/api/tts?text='+encodeURIComponent(txt)+'&lang='+this._lang,{signal:ctrl.signal});
      clearTimeout(tid);
      if(!r.ok) return null;
      return await r.blob();
    }catch(_){ return null; }
  },

  _playBlob(blob, txt){
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    a.playbackRate = this._rate;
    this._audio = a;
    a.ontimeupdate = ()=>{
      if(!a.duration) return;
      const ratio    = a.currentTime / a.duration;
      const chunkPos = Math.round(ratio * txt.length);
      const absChar  = this._offset + chunkPos;
      const pct      = Math.min(99, absChar / this._totalLen * 100);
      if(this._onProgress) this._onProgress(pct, absChar, txt, chunkPos, 0);
    };
    a.onended = ()=>{
      URL.revokeObjectURL(url);
      this._offset += txt.length + 1;
      this._idx++;
      this._next();
    };
    a.onerror = ()=>{
      URL.revokeObjectURL(url);
      this._offset += txt.length + 1;
      this._idx++;
      this._next();
    };
    a.play().catch(()=>{ URL.revokeObjectURL(url); this._playSpeech(txt); });
  },

  _playSpeech(txt){
    if(!window.speechSynthesis) { this._offset+=txt.length+1; this._idx++; this._next(); return; }
    const u = new SpeechSynthesisUtterance(txt);
    if(selVoice) u.voice = selVoice;
    u.rate = this._rate;
    u.lang = this._lang==='ko' ? 'ko-KR' : 'en-US';
    u.onboundary = e=>{
      if(e.name!=='word') return;
      const absChar = this._offset + e.charIndex;
      const pct     = Math.min(99, absChar / this._totalLen * 100);
      if(this._onProgress) this._onProgress(pct, absChar, txt, e.charIndex, e.charLength||1);
    };
    u.onend = ()=>{ this._offset+=txt.length+1; this._idx++; this._next(); };
    u.onerror = e=>{ if(e.error==='interrupted'||e.error==='canceled') return; this._offset+=txt.length+1; this._idx++; this._next(); };
    speechSynthesis.speak(u);
  },

  pause(){
    if(!this._playing||this._paused) return;
    this._paused=true;
    if(this._audio) this._audio.pause();
    else if(speechSynthesis) speechSynthesis.pause();
  },
  resume(){
    if(!this._playing||!this._paused) return;
    this._paused=false;
    if(this._audio) this._audio.play();
    else if(speechSynthesis) speechSynthesis.resume();
  },
  stop(){
    this._playing=false; this._paused=false;
    if(this._audio){ try{this._audio.pause();}catch(_){} this._audio=null; }
    try{ if(speechSynthesis) speechSynthesis.cancel(); }catch(_){}
    this._chunks=[]; this._idx=0; this._offset=0;
  },
  setRate(v){
    this._rate=v;
    if(this._audio) this._audio.playbackRate=v;
  }
};

TTS._onProgress = (pct, absChar, chunk, chunkPos, wordLen) => {
  setProg(pct);
  if(chunk) updateReadingText(chunk, chunkPos, wordLen);
};
TTS._onChunkStart = (chunk) => {
  updateReadingText(chunk, 0, 0);
};
TTS._onDone = () => {
  isOn=false; isPaused=false; setProg(100); updPlayBtn();
  if(curIdx>=0){ Q[curIdx].status='done'; renderQ(); saveQ(); }
  releaseWakeLock();
  // 자동 다음 기사
  const ni = Q.findIndex((q,i)=>i>curIdx&&q.status==='ready');
  if(ni!==-1){ showToast(`✅ 다음: ${Q[ni].title.slice(0,20)}`); setTimeout(()=>playAt(ni,true),900); }
  else showToast('🎉 모든 기사 읽기 완료!');
};

/* ══════════════════════
   INIT
══════════════════════ */
(function init(){
  if(!window.speechSynthesis) show('ttsWarn');
  if(!navigator.share) hide('nativeShareOpt');

  function loadVoices(){
    const all = speechSynthesis?.getVoices() || [];
    if(!all.length) return;
    allVoices = all;
    if(!selVoice) selVoice = selectBestVoice(all);
    renderVoices();
    if(all.length>1){ $('curVoiceName').textContent=selVoice?.name||''; show('voiceRow'); }
  }
  if(speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

  try{ const s=parseFloat(localStorage.getItem(LS_SPD)); if(!isNaN(s)) spd=Math.max(0.8,Math.min(2.0,s)); TTS._rate=spd; }catch(_){}
  // slider 초기값 설정은 DOM 준비 후 실행
  setTimeout(()=>highlightSpd(), 0);
  try{
    const raw=localStorage.getItem(LS_Q);
    if(raw){ Q=JSON.parse(raw).map(x=>({...x,status:x.status==='loading'?'pending':x.status})); uid=Math.max(0,...Q.map(q=>q.id)); renderQ(); }
  }catch(_){}
  try{ const raw=localStorage.getItem(LS_SAVED); if(raw){ SAVED=JSON.parse(raw); renderSaved(); } }catch(_){}
  $('urlInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addUrl(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

  // TTS 가용성 확인 (비동기)
  TTS.checkAvail();
})();

// Google KO → KO 여성 → KO → EN Google → EN
function selectBestVoice(voices){
  const ko = voices.filter(v=>v.lang?.startsWith('ko'));
  const en = voices.filter(v=>v.lang?.startsWith('en'));
  const gko = ko.filter(v=>GOOGLE_KW.some(k=>v.name.toLowerCase().includes(k)));
  if(gko.length) return gko[0];
  const fko = ko.filter(v=>FEMALE_KW.some(k=>v.name.toLowerCase().includes(k)));
  if(fko.length) return fko[0];
  if(ko.length) return ko[0];
  if(en.length) return en[0];
  return voices[0]||null;
}

function saveQ(){ try{localStorage.setItem(LS_Q,JSON.stringify(Q));}catch(_){} }
function saveSavedList(){ try{localStorage.setItem(LS_SAVED,JSON.stringify(SAVED));}catch(_){} }

/* ══════════════════════
   TABS

   VOICES (한국어/영어만)
══════════════════════ */
function toggleVoice(){

  $('voiceArrow').textContent=voiceOpen?'▲':'▼';

function renderVoices(){
  // 한국어, 영어만 표시
  const list = allVoices.filter(v=>v.lang?.startsWith('ko')||v.lang?.startsWith('en')).slice(0,24);
  if(list.length<2){ hide('voiceRow'); return; }

    const badge=isGoo?'<span class="vbadge g">Google</span>':isFem?'<span class="vbadge f">여성</span>':isKo?'<span class="vbadge k">한국어</span>':'';

      <span style="flex:1">${on?'✓ ':''}${v.name}<span style="opacity:.3;font-size:9px;margin-left:4px">${v.lang}</span></span>${badge}

}
function pickVoice(name){

/* ══════════════════════
   ARTICLE FETCH + PARSE
══════════════════════ */
function preprocessUrl(url){
  return url.replace(/^https?:\/\/blog\.naver\.com/,'https://m.blog.naver.com');
}
async function fetchWithTimeout(url,ms){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(tid); return r; }
  catch(e){ clearTimeout(tid); throw e; }
}
async function raceProxies(url){
  const enc=encodeURIComponent(url);
  async function tryOne(pu,isJson){
    const r=await fetchWithTimeout(pu,12000);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=isJson?(await r.json()).contents||'':await r.text();
    if(!text||text.length<100) throw new Error('응답 너무 짧음');
    return text;
  }
  const attempts=[
    tryOne(`https://api.allorigins.win/get?url=${enc}`,true),
    tryOne(`https://corsproxy.io/?${enc}`,false),
    tryOne(`https://api.codetabs.com/v1/proxy?quest=${enc}`,false),
    tryOne(`https://api.allorigins.win/raw?url=${enc}`,false),
  ];
  return new Promise(resolve=>{
    let failed=0;
    attempts.forEach(p=>p.then(html=>resolve(html)).catch(()=>{ if(++failed===attempts.length) resolve(''); }));
  });
}

async function fetchArticle(url){
  const purl = preprocessUrl(url);

  // 1순위: Vercel 자체 프록시
  try{
    const r=await fetchWithTimeout('/api/proxy?url='+encodeURIComponent(purl),8000);
    if(r.ok){ const text=await r.text(); if(text.length>100) return smartParse(text,url); }
  }catch(_){}

  // 2순위: 공개 CORS 프록시 병렬 레이스
  const raw=await raceProxies(purl);
  if(!raw||raw.length<100){
    throw new Error('페이지를 불러올 수 없습니다.\n로그인 필요 또는 봇 차단 사이트일 수 있습니다.\nVercel 배포 후 성공률이 크게 올라갑니다.');
  }
  return smartParse(raw, url);
}

// JSON/HTML 자동 감지 후 파싱
function smartParse(raw, url){
  // Stibee API: JSON 응답 처리
  if(url.includes('stibee.com')){
    try{
      // 응답이 JSON인 경우
      if(raw.trim().startsWith('{')){
        const j=JSON.parse(raw);
        // Stibee API 응답 구조: {"ok":true,"value":{"htmlbody":"...",...}}
        const html = j?.value?.htmlbody || j?.value?.html || j?.html || j?.content;
        if(html && html.length>100) return parseHtml(html, url);
      }
    }catch(_){}
  }

  // YOZM (Next.js): __NEXT_DATA__ JSON에서 콘텐츠 추출
  if(url.includes('yozm.wishket.com')){
    try{
      const m = raw.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
      if(m){
        const nd = JSON.parse(m[1]);
        const pp = nd?.props?.pageProps;
        // YOZM 데이터 경로 시도
        const body = pp?.magazine?.content || pp?.magazine?.body ||
                     pp?.post?.content || pp?.post?.body ||
                     pp?.article?.content || pp?.article?.body ||
                     pp?.data?.content || pp?.data?.body;
        const titleVal = pp?.magazine?.title || pp?.post?.title || pp?.article?.title || '';
        if(body){
          const clean = body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          if(clean.length>80) return {title:titleVal||'(제목 없음)', content:clean.slice(0,10000)};
        }
      }
    }catch(_){}
  }

  return parseHtml(raw, url);
}

function parseHtml(html, url){
  const doc=new DOMParser().parseFromString(html,'text/html');

  // 노이즈 제거
  [
    'script','style','nav','footer','aside','iframe','noscript',
    '[class*="banner"]','[class*="sidebar"]','[class*="comment"]','[class*="share"]',
    '[class*="social"]','[class*="related"]','[class*="recommend"]','[class*="popup"]',
    '[class*="gnb"]','[class*="lnb"]','[id*="comment"]',
    '[class*="ad-"]','[id*="ad-"]','[class*="advertisement"]',
    '.se-image-container','.se-video-container','.se-module-oglink',
  ].forEach(s=>{ try{doc.querySelectorAll(s).forEach(e=>e.remove());}catch(_){} });

  const title=(
    doc.querySelector('meta[property="og:title"]')?.getAttribute('content')||
    doc.querySelector('meta[name="title"]')?.getAttribute('content')||
    doc.querySelector('h1')?.textContent||
    doc.querySelector('title')?.textContent||'(제목 없음)'
  ).replace(/\s+/g,' ').trim();

  // 사이트별 특화
  let specific=null;
  if(url.includes('stibee.com')){
    specific=doc.querySelector('.stibee-email,.email-body,.body-section,table');
  } else if(url.includes('yozm.wishket.com')){
    specific=doc.querySelector('[class*="post_content"],[class*="article_body"],[class*="detail__content"],[class*="magazine-content"],article,.post-content');
  } else if(url.includes('naver.com')){
    specific=doc.querySelector('.se-main-container,#postViewArea,.post_content,#articleBodyContents');
  }

  const sels=[
    '#articleBodyContents','#articeBody','.article_body','.article-body',
    '.article_content','.article-content','[itemprop="articleBody"]',
    '.news_end_body','.se-main-container','#postViewArea','.post-view',
    '.entry-content','.article-view','[class*="tt_article"]',
    '[class*="content-body"]','[class*="post-content"]','[class*="story-content"]',
    '[class*="article-detail"]','[class*="detail-content"]',
    'td[class*="content"]','article','main','[role="main"]',
    '#content','.content','.container','body',
  ];

  let best=specific, bestLen=specific?(specific.textContent||'').replace(/\s+/g,' ').trim().length:0;
  if(!best||bestLen<300){
    for(const sel of sels){
      try{
        doc.querySelectorAll(sel).forEach(el=>{
          const len=(el.textContent||'').replace(/\s+/g,' ').trim().length;
          if(len>bestLen&&len>200){ bestLen=len; best=el; }
        });
        if(best&&bestLen>800) break;
      }catch(_){}
    }
  }
  if(!best) best=doc.body;

  let text='';
  const paras=best.querySelectorAll('p,h2,h3,h4,li,.se-text-paragraph,[class*="paragraph"]');
  if(paras.length>=3) text=Array.from(paras).map(p=>p.textContent.trim()).filter(t=>t.length>15).join('\n');
  if(text.length<300) text=best.textContent||'';

  text=text.replace(/[​-‍﻿]/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<80) throw new Error('본문을 찾을 수 없습니다. 이 사이트는 지원되지 않을 수 있습니다.');
  return {title, content:text.slice(0,10000)};
}

        <button class="qa qa-del" onclick="removeItem(${q.id})">✕</button>

function toggleSite(id, url){
  const wrap = document.getElementById('site-'+id);

/* ══════════════════════
   기사 탭하여 재생
══════════════════════ */
function playOrLoadItem(idx){
  const q = Q[idx]; if(!q) return;
  if(q.status === 'loading') return; // 로딩 중엔 무시
  // 이미 이 기사 재생 중이면 무시
  if(curIdx === idx && isOn && !isPaused) return;
  if(q.status === 'ready'){
    stopAll();
    setTimeout(()=>playAt(idx, true), 80);
  } else if(q.status === 'done'){
    q.status = 'ready';
    stopAll();
    setTimeout(()=>playAt(idx, true), 80);
  } else {
    // pending or error → 로드 후 재생
    stopAll();
    loadAndPlay(idx);
  }
}

/* ══════════════════════
   LOAD & PLAY
══════════════════════ */
async function loadAndPlay(startIdx){
  const btn=$('playAllBtn');
  btn.disabled=true; btn.textContent='⏳ 불러오는 중...'; hideErr();
  for(let i=startIdx;i<Q.length;i++){
    if(Q[i].status!=='pending') continue;
    Q[i].status='loading'; renderQ();
    try{
      const art=await fetchArticle(Q[i].url);
      Q[i].title=art.title; Q[i].content=art.content; Q[i].status='ready';
    }catch(e){ Q[i].status='error'; Q[i].err=e.message; }
    renderQ(); saveQ();
  }
  btn.disabled=false; btn.textContent='▶ 전체 불러오기 & 재생';
  const first=Q.findIndex((q,i)=>i>=startIdx&&q.status==='ready');
  if(first!==-1) playAt(first,true);
  else showErr('불러올 수 있는 기사가 없습니다.\n차단됐거나 로그인이 필요한 사이트일 수 있습니다.');
}

/* ══════════════════════
   PLAYBACK
══════════════════════ */
function playAt(idx, autoNext){
  if(!TTS) return;
  const q=Q[idx];
  if(!q?.content) return;
  TTS.stop();
  curIdx=idx; isOn=true; isPaused=false;
  $('plTitle').textContent=q.title;
  setProg(0);
  const _rs=document.getElementById('readingStrip');
  if(_rs){ _rs.innerHTML='<span style="opacity:.4">⏳ 읽는 중…</span>'; _rs.classList.remove('dn'); }
  renderQ();
  requestWakeLock();
  TTS._onDone = ()=>{
    isOn=false; isPaused=false; setProg(100); updPlayBtn();
    if(curIdx>=0){ Q[curIdx].status='done'; renderQ(); saveQ(); }
    releaseWakeLock();
    if(!autoNext) return;
    const ni=Q.findIndex((q,i)=>i>idx&&q.status==='ready');
    if(ni!==-1){ showToast(`✅ 다음: ${Q[ni].title.slice(0,18)}`); setTimeout(()=>playAt(ni,true),800); }
    else showToast('🎉 모든 기사 읽기 완료!');
  };
  const lang = detectLang(q.content);
  TTS.start(q.title+'. '+q.content, lang);
  updPlayBtn();
}

// 텍스트 언어 감지 (한국어 비율 50% 이상이면 ko)
function detectLang(text){
  const korean = (text.match(/[가-힣]/g)||[]).length;
  return korean / text.length > 0.2 ? 'ko' : 'en';
}

function togglePlay(){
  if(isPaused && wasInterrupted){
    announceAndResume();
  } else if(!isOn){
    if(curIdx>=0&&Q[curIdx]?.status==='ready') playAt(curIdx,true);
    else loadAndPlay(0);
  } else if(isPaused){
    TTS.resume(); isPaused=false; updPlayBtn();
  } else {
    TTS.pause(); isPaused=true; updPlayBtn();
  }
}
function stopAll(){
  TTS.stop(); isOn=false; isPaused=false; wasInterrupted=false;
  setProg(0); updPlayBtn(); renderQ(); releaseWakeLock();
  const _rs=document.getElementById('readingStrip'); if(_rs) _rs.classList.add('dn');
}

// 화면 복귀 후 재생 재개: "이어서 읽어드릴게요" 안내 후 현재 청크부터 재시작
async function announceAndResume(){
  wasInterrupted = false;
  isPaused = false;
  updPlayBtn();

  const msg = '이어서 읽어드릴게요';
  const resume = ()=>{
    if(TTS._audio){ try{TTS._audio.pause();}catch(_){} TTS._audio=null; }
    try{ if(speechSynthesis) speechSynthesis.cancel(); }catch(_){}
    TTS._playing = true;
    TTS._paused  = false;
    TTS._next();
  };

  if(TTS.useAudio){
    try{
      const blob = await TTS._fetchAudio(msg);
      if(blob){
        const url = URL.createObjectURL(blob);
        const a = new Audio(url);
        a.playbackRate = TTS._rate;
        a.onended = ()=>{ URL.revokeObjectURL(url); resume(); };
        a.onerror  = ()=>{ URL.revokeObjectURL(url); resume(); };
        a.play();
        return;
      }
    }catch(_){}
  }
  if(window.speechSynthesis){
    const u = new SpeechSynthesisUtterance(msg);
    if(selVoice) u.voice = selVoice;
    u.lang = 'ko-KR'; u.rate = TTS._rate;
    u.onend  = resume;
    u.onerror = resume;
    speechSynthesis.speak(u);
  } else { resume(); }
}

/* ══════════════════════
   직접 텍스트 입력 (접속 불가 사이트 대비)
══════════════════════ */
let _dInputIdx = -1;
function openDInput(idx){ _dInputIdx=idx; document.getElementById('directInputModal').classList.remove('dn'); document.getElementById('directInputArea').value=''; setTimeout(()=>document.getElementById('directInputArea').focus(),100); }
function closeDInput(){ document.getElementById('directInputModal').classList.add('dn'); _dInputIdx=-1; }
function onDInputClick(e){ if(e.target.id==='directInputModal') closeDInput(); }
function confirmDInput(){
  const text = document.getElementById('directInputArea').value.trim();
  if(!text||_dInputIdx<0) return;
  const q=Q[_dInputIdx]; if(!q) return;
  q.content = text.slice(0,10000);
  // 첫 줄이 제목처럼 보이면 제목으로 사용
  const firstLine = text.split('\n')[0].trim();
  if(q.title===shortHost(q.url)||q.title==='(제목 없음)') q.title=firstLine.slice(0,60)||q.title;
  q.status='ready'; q.err='';
  closeDInput(); renderQ(); saveQ();
  showToast('✏️ 텍스트 입력 완료! 재생 가능합니다.');
}
function skipFwd(sec){
  if(!TTS._chunks.length) return;

  // 현재 절대 글자 위치 계산
  let curAbs = TTS._offset;
  if(TTS.useAudio && TTS._audio && TTS._audio.duration > 0){
    const ratio = TTS._audio.currentTime / TTS._audio.duration;
    curAbs += Math.round(ratio * (TTS._chunks[TTS._idx]||'').length);
  }

  // Google TTS + 앞으로 스킵: 현재 청크 안에서 seek 가능하면 직접 seek
  if(sec > 0 && TTS.useAudio && TTS._audio && TTS._audio.duration > 0){
    const newTime = TTS._audio.currentTime + sec * TTS._rate;
    if(newTime < TTS._audio.duration - 0.05){
      TTS._audio.currentTime = newTime;
      showToast('⏩ +10초');
      return;
    }
  }

  // 현재 재생 중단 (in-flight fetch 무효화 포함)
  if(TTS._audio){
    TTS._audio.onended = null; TTS._audio.onerror = null;
    TTS._audio.pause();
    try{ URL.revokeObjectURL(TTS._audio.src); }catch(_){}
    TTS._audio = null;
  }
  try{ if(speechSynthesis) speechSynthesis.cancel(); }catch(_){}
  TTS._gen++; // 진행 중이던 _fetchAudio를 무효화

  // 절대 위치 기준 목표 글자 수 (한국어 약 5자/초 @ 1x)
  const skipChars = Math.round(sec * spd * 5);
  const targetAbs = Math.max(0, Math.min(TTS._totalLen - 1, curAbs + skipChars));

  // 목표 청크 탐색
  let off = 0;
  for(let i = 0; i < TTS._chunks.length; i++){
    const nextOff = off + TTS._chunks[i].length + 1;
    if(nextOff > targetAbs || i === TTS._chunks.length - 1){
      TTS._idx = i; TTS._offset = off;
      TTS._playing = true; TTS._paused = false;
      TTS._next();
      showToast(sec > 0 ? '⏩ +10초' : '⏪ -10초');
      return;
    }
    off = nextOff;
  }

  TTS._playing = false;
  if(TTS._onDone) TTS._onDone();
}

function nextArt(){
  const ni=Q.findIndex((q,i)=>i>curIdx&&(q.status==='ready'||q.status==='pending'));
  if(ni!==-1){ stopAll(); loadAndPlay(ni); }
}
function prevArt(){
  for(let i=curIdx-1;i>=0;i--){
    if(Q[i].status!=='error'){
      if(Q[i].status==='done') Q[i].status='ready';
      stopAll(); setTimeout(()=>playAt(i,true),100); return;
    }
  }
}
function restartCur(){
  if(curIdx>=0&&Q[curIdx]){
    if(Q[curIdx].status==='done') Q[curIdx].status='ready';
    stopAll(); setTimeout(()=>playAt(curIdx,true),100);
  }
}
/* ══════════════════════
   읽는 부분 표시 (카라오케)
══════════════════════ */
function updateReadingText(chunk, pos, wordLen){
  const rs = document.getElementById('readingStrip');
  if(!rs || !chunk) return;

  // 현재 단어 범위 계산
  let start = pos, end = pos;
  if(wordLen > 0){
    // Web Speech onboundary: 정확한 단어 위치
    end = pos + wordLen;
  } else {
    // Google TTS: 시간 비율로 추정한 위치 → 단어 경계 찾기
    while(start > 0 && !/[ \n]/.test(chunk[start-1])) start--;
    end = pos;
    while(end < chunk.length && !/[ \n.,!?。]/.test(chunk[end])) end++;
    if(end <= start) end = Math.min(chunk.length, start + 6);
  }

  // 청크 전체를 표시 → scrollTop으로 현재 단어를 2번째 줄(가운데)에 고정
  const b = esc(chunk.slice(0, start));
  const h = esc(chunk.slice(start, end));
  const a = esc(chunk.slice(end));

  rs.innerHTML = b + (h ? `<span class="rdhlt">${h}</span>` : '') + a;
  rs.classList.remove('dn');

  // 하이라이트 요소를 가운데(2번째) 줄에 오도록 스크롤
  const hlEl = rs.querySelector('.rdhlt');
  if(hlEl){
    const lineH = 13 * 1.65; // 한 줄 높이 ≈21px
    // offsetTop에서 padding(8px) + 1줄을 빼면 하이라이트가 2번째 줄에 위치
    rs.scrollTop = Math.max(0, hlEl.offsetTop - 8 - lineH);
  }
}

function estimateReadTime(content){
  if(!content || content.length < 30) return '';
  const seconds = Math.round(content.length / 200 * 60);
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  if(mins === 0) return `~${secs}초`;
  if(secs === 0) return `~${mins}분`;
  return `~${mins}분 ${secs < 10 ? '0'+secs : secs}초`;
}

function setSpd(v){
  spd = parseFloat(parseFloat(v).toFixed(1));
  TTS.setRate(spd);
  const valEl = document.getElementById('spdVal');
  if(valEl) valEl.textContent = spd.toFixed(1)+'x';
  updateSliderTrack();
  try{ localStorage.setItem(LS_SPD,String(spd)); }catch(_){}
}
function highlightSpd(){
  const sl = document.getElementById('spdSlider');
  const valEl = document.getElementById('spdVal');
  if(sl){ sl.value = spd; }
  if(valEl) valEl.textContent = spd.toFixed(1)+'x';
  updateSliderTrack();
}
function updateSliderTrack(){
  const sl = document.getElementById('spdSlider');
  if(!sl) return;
  const min=0.8, max=2.0;
  const pct = (spd - min) / (max - min) * 100;
  sl.style.background = `linear-gradient(to right,var(--ac) ${pct}%,rgba(255,255,255,.15) ${pct}%)`;
}

/* ══════════════════════
   WAKE LOCK
══════════════════════ */
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(_){}
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(_){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    // Web Speech API는 화면 꺼짐 시 강제 중단됨 → 재개 안내 플래그 설정
    if(isOn && !isPaused && TTS.useAudio===false){
      wasInterrupted = true;
      isPaused = true;
      TTS._paused = true;
      try{ speechSynthesis.cancel(); }catch(_){}
      updPlayBtn();
    }
    // Google TTS (HTML5 Audio)는 백그라운드에서도 계속 재생 → 별도 처리 불필요
  } else {
    if(isOn) requestWakeLock();
  }
});

══════════════════════ */
function toggleSaveItem(idx){
  const q=Q[idx]; if(!q) return;
  const exists=SAVED.find(s=>s.url===q.url);

  else{ SAVED.unshift({id:Date.now(),url:q.url,title:q.title,savedAt:new Date().toLocaleDateString('ko-KR')}); showToast('⭐ 저장되었습니다!'); }
  saveSavedList(); renderQ(); renderSaved();
}

        <button class="sv-btn sv-btn-del" onclick="removeSaved('${su}')">✕</button>

}
function removeSaved(url){ SAVED=SAVED.filter(s=>s.url!==url); saveSavedList(); renderSaved(); renderQ(); }
function addSavedToQueue(url,title){
  if(!Q.find(q=>q.url===url)){ Q.push({id:++uid,url,title,content:'',status:'pending',err:''}); saveQ(); renderQ(); }
  switchTab('queue'); showToast('재생목록에 추가되었습니다!');
}

══════════════════════ */
function openShare(url,title){ shareTarget={url,title}; $('sheetTitle').textContent=`"${title.slice(0,28)}" 공유`; show('shareOverlay'); }
function shareCurrentArticle(){ if(curIdx>=0&&Q[curIdx]) openShare(Q[curIdx].url,Q[curIdx].title); }
function closeShare(){ hide('shareOverlay'); }
function onShareClick(e){ if(e.target.id==='shareOverlay') closeShare(); }
async function doShare(type){
  if(!shareTarget) return;
  const{url,title}=shareTarget;
  if(type==='copy'){
    try{ await navigator.clipboard.writeText(url); }
    catch(_){ const t=document.createElement('textarea'); t.value=url; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); }
    closeShare(); showToast('🔗 URL이 복사되었습니다!');
  } else if(type==='native'){
    try{ await navigator.share({title,url}); closeShare(); }catch(_){}
  } else if(type==='email'){
    location.href=`mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(url)}`; closeShare();
  }
}

function setProg(v){ $('progFill').style.width=v+'%'; }
function updPlayBtn(){ $('playBtn').textContent=(isOn&&!isPaused)?'⏸':'▶'; }
let toastTmr=null;
function showToast(msg){

  if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.style.display='block';

  toastTmr=setTimeout(()=>{ if(t) t.style.display='none'; },2500);

function show(id){ document.getElementById(id)?.classList.remove('dn'); }
function hide(id){ document.getElementById(id)?.classList.add('dn'); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortHost(url){ try{ return new URL(url).hostname.replace('www.',''); }catch{ return url.slice(0,30); } }
