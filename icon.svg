  <path d="M 80 170 Q 20 256 80 342" stroke="url(#wave)" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 392 200 Q 432 256 392 312" stroke="url(#wave)" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8"/>
